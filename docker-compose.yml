services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_matters_dev
      POSTGRES_PASSWORD: ai_matters_dev
      POSTGRES_DB: ai_matters
    ports:
      - '5432:5432'
    volumes:
      - ai_matters_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_matters_dev -d ai_matters']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_matters_postgres_data:
