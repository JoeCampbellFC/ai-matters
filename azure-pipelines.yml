# AI Matters CI/CD -- builds and tests both the frontend and the server,
# then deploys a self-contained package to a single Azure App Service (see
# infra/main.bicep). Infra itself (the App Service, Postgres, etc.) is
# provisioned separately, once, via that Bicep template -- this pipeline
# ships code, plus keeps a small set of rotatable secrets (see the
# 'ai-matters-secrets' variable group below) in sync with the App Service's
# app settings on every run, so rotating e.g. AZURE_OPENAI_API_KEY never
# needs a manual az command.
#
# infra/main.bicep has already been deployed (resource group fm-ai-matters,
# App Service fm-ai-matters, F1 Free tier); both variables below already
# match the real Azure DevOps service connection and App Service name.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: ai-matters-secrets
  - name: nodeVersion
    value: '22.x'
  - name: azureServiceConnectionName
    value: 'ai-matters-azure'
  - name: appServiceName
    value: 'fm-ai-matters'
  - name: resourceGroupName
    value: 'fm-ai-matters'

stages:
  - stage: Build
    displayName: 'Build and test'
    jobs:
      - job: BuildAndTest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Use Node $(nodeVersion)'

          - script: npm ci
            displayName: 'npm ci (frontend)'

          - script: npm ci
            displayName: 'npm ci (server)'
            workingDirectory: server

          - script: npm run lint
            displayName: 'Lint frontend'

          - script: npm test
            displayName: 'Test frontend'

          - script: npm run typecheck
            displayName: 'Typecheck server'
            workingDirectory: server

          - script: npm test
            displayName: 'Test server'
            workingDirectory: server

          - script: npm run build
            displayName: 'Build frontend'

          - script: npm run build
            displayName: 'Build server'
            workingDirectory: server

          - task: CopyFiles@2
            displayName: 'Copy built frontend into server/dist/public'
            inputs:
              sourceFolder: dist
              contents: '**'
              targetFolder: server/dist/public

          - script: |
              set -e
              rm -rf "$(Build.StagingDirectory)/app"
              mkdir -p "$(Build.StagingDirectory)/app"
              cp -r dist "$(Build.StagingDirectory)/app/dist"
              cp package.json "$(Build.StagingDirectory)/app/package.json"
              cp package-lock.json "$(Build.StagingDirectory)/app/package-lock.json"
              cd "$(Build.StagingDirectory)/app"
              npm ci --omit=dev
            displayName: 'Assemble self-contained deploy package (dist + production node_modules)'
            workingDirectory: server

          - task: ArchiveFiles@2
            displayName: 'Zip deploy package'
            inputs:
              rootFolderOrFile: '$(Build.StagingDirectory)/app'
              includeRootFolder: false
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'

          - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
            artifact: app

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployToAzure
        displayName: 'Deploy to App Service'
        steps:
          - download: current
            artifact: app

          - task: AzureWebApp@1
            displayName: 'Deploy to $(appServiceName)'
            inputs:
              azureSubscription: '$(azureServiceConnectionName)'
              appType: webAppLinux
              appName: '$(appServiceName)'
              package: '$(Pipeline.Workspace)/app/app.zip'

          - task: AzureCLI@2
            displayName: 'Sync rotatable secrets to app settings'
            inputs:
              azureSubscription: '$(azureServiceConnectionName)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                az webapp config appsettings set \
                  --name "$(appServiceName)" \
                  --resource-group "$(resourceGroupName)" \
                  --settings AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" \
                  --output none
            env:
              # Secret variables don't expand via $(...) macro syntax inside a script body --
              # they must be mapped to an env var here instead. Add more lines the same way
              # (and another --settings KEY="$VALUE" above) for any other secret that needs
              # to stay in sync, e.g. SESSION_SECRET.
              AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
