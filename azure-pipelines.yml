# AI Matters CI/CD -- builds and tests both the frontend and the server,
# then deploys a self-contained package to a single Azure App Service (see
# infra/main.bicep). Infra/app-settings/secrets are provisioned separately,
# once, via that Bicep template -- this pipeline only ever ships code.
#
# Before running this pipeline for the first time:
#   1. Replace azureServiceConnectionName and appServiceName below.
#   2. Make sure infra/main.bicep has already been deployed once (see its
#      header comment) so the target App Service exists.
#   3. Create an Azure DevOps Environment named "production" (Pipelines ->
#      Environments -> New environment) -- add an approval check there if
#      you want a manual gate before each deploy.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  # CHANGE-ME: the Azure DevOps service connection name (Project Settings ->
  # Service connections) pointing at your Azure subscription/resource group.
  azureServiceConnectionName: 'CHANGE-ME-service-connection'
  # CHANGE-ME: must match the `appName` parameter used when deploying infra/main.bicep.
  appServiceName: 'CHANGE-ME-app-service-name'

stages:
  - stage: Build
    displayName: 'Build and test'
    jobs:
      - job: BuildAndTest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Use Node $(nodeVersion)'

          - script: npm ci
            displayName: 'npm ci (frontend)'

          - script: npm ci
            displayName: 'npm ci (server)'
            workingDirectory: server

          - script: npm run lint
            displayName: 'Lint frontend'

          - script: npm test
            displayName: 'Test frontend'

          - script: npm run typecheck
            displayName: 'Typecheck server'
            workingDirectory: server

          - script: npm test
            displayName: 'Test server'
            workingDirectory: server

          - script: npm run build
            displayName: 'Build frontend'

          - script: npm run build
            displayName: 'Build server'
            workingDirectory: server

          - task: CopyFiles@2
            displayName: 'Copy built frontend into server/dist/public'
            inputs:
              sourceFolder: dist
              contents: '**'
              targetFolder: server/dist/public

          - script: |
              set -e
              rm -rf "$(Build.StagingDirectory)/app"
              mkdir -p "$(Build.StagingDirectory)/app"
              cp -r dist "$(Build.StagingDirectory)/app/dist"
              cp package.json "$(Build.StagingDirectory)/app/package.json"
              cp package-lock.json "$(Build.StagingDirectory)/app/package-lock.json"
              cd "$(Build.StagingDirectory)/app"
              npm ci --omit=dev
            displayName: 'Assemble self-contained deploy package (dist + production node_modules)'
            workingDirectory: server

          - task: ArchiveFiles@2
            displayName: 'Zip deploy package'
            inputs:
              rootFolderOrFile: '$(Build.StagingDirectory)/app'
              includeRootFolder: false
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'

          - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
            artifact: app

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToAzure
        displayName: 'Deploy to App Service'
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to $(appServiceName)'
                  inputs:
                    azureSubscription: '$(azureServiceConnectionName)'
                    appType: webAppLinux
                    appName: '$(appServiceName)'
                    package: '$(Pipeline.Workspace)/app/app.zip'
